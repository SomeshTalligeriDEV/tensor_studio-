<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680"><rect width="1600" height="680" rx="26" fill="#102329"/><text x="64" y="80" font-size="39" font-family="Arial" fill="#f1f8f0">One journey. A place for every next step.</text><text x="64" y="126" font-size="23" font-family="Arial" fill="#b7d6c8">Learn the language → create something useful → understand what runs.</text><rect x="64" y="200" width="274" height="230" rx="18" fill="#1d393d" stroke="#4f7567"/><text x="86" y="242" font-size="23" font-family="Arial" fill="#dcf18b">01</text><text x="86" y="285" font-size="26" font-family="Arial" fill="#f1f8f0">Bittensor Quest</text><text x="86" y="327" font-size="20" font-family="Arial" fill="#dcf18b">Learn through play</text><text x="86" y="370" font-size="16" font-family="Arial" fill="#b8cfc5">Lessons · quizzes · simulations</text><path d="M340 308h20m-7-7 7 7-7 7" stroke="#a8caba" fill="none" stroke-width="2"/><rect x="364" y="200" width="274" height="230" rx="18" fill="#1d393d" stroke="#4f7567"/><text x="386" y="242" font-size="23" font-family="Arial" fill="#bce8d6">02</text><text x="386" y="285" font-size="26" font-family="Arial" fill="#f1f8f0">TensorStudio</text><text x="386" y="327" font-size="20" font-family="Arial" fill="#bce8d6">Shape and build your idea</text><text x="386" y="370" font-size="16" font-family="Arial" fill="#b8cfc5">Assistant · code · live preview</text><path d="M640 308h20m-7-7 7 7-7 7" stroke="#a8caba" fill="none" stroke-width="2"/><rect x="664" y="200" width="274" height="230" rx="18" fill="#1d393d" stroke="#4f7567"/><text x="686" y="242" font-size="23" font-family="Arial" fill="#cbbff0">03</text><text x="686" y="285" font-size="26" font-family="Arial" fill="#f1f8f0">Evaluation</text><text x="686" y="327" font-size="20" font-family="Arial" fill="#cbbff0">Define what good means</text><text x="686" y="370" font-size="16" font-family="Arial" fill="#b8cfc5">Labelled data · scoring reports</text><path d="M940 308h20m-7-7 7 7-7 7" stroke="#a8caba" fill="none" stroke-width="2"/><rect x="964" y="200" width="274" height="230" rx="18" fill="#1d393d" stroke="#4f7567"/><text x="986" y="242" font-size="23" font-family="Arial" fill="#aad8f3">04</text><text x="986" y="285" font-size="26" font-family="Arial" fill="#f1f8f0">TensorScan</text><text x="986" y="327" font-size="20" font-family="Arial" fill="#aad8f3">Read the real network</text><text x="986" y="370" font-size="16" font-family="Arial" fill="#b8cfc5">Blocks · events · subnet views</text><path d="M1240 308h20m-7-7 7 7-7 7" stroke="#a8caba" fill="none" stroke-width="2"/><rect x="1264" y="200" width="274" height="230" rx="18" fill="#1d393d" stroke="#4f7567"/><text x="1286" y="242" font-size="23" font-family="Arial" fill="#83deea">05</text><text x="1286" y="285" font-size="26" font-family="Arial" fill="#f1f8f0">TensorNode</text><text x="1286" y="327" font-size="20" font-family="Arial" fill="#83deea">Operate with a clear record</text><text x="1286" y="370" font-size="16" font-family="Arial" fill="#b8cfc5">Drafts · approvals · billing</text><rect x="64" y="478" width="1470" height="95" rx="16" fill="#172e32" stroke="#7e869a" stroke-dasharray="7 5"/><text x="88" y="517" font-size="24" fill="#d1c9ed" font-family="Arial">Subnet Factory · separate generation prototype</text><text x="88" y="550" font-size="19" fill="#b9c9c4" font-family="Arial">Miner contributions → validator checks → project artifacts. Proposed Studio integration; no registered public Factory subnet asserted.</text><text x="64" y="625" font-size="19" fill="#adc9bd" font-family="Arial">Arrows show the user journey. Quest, TensorNode and Subnet Factory are separate projects with links to their own code.</text></svg>