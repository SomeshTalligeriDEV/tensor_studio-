<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560"><rect width="1600" height="560" rx="26" fill="#102329"/><text x="64" y="82" font-family="Arial" font-size="40" fill="#f2f8f0">Why build around Bittensor?</text><text x="64" y="131" font-family="Arial" font-size="24" fill="#b9d7c6">A shared network for useful work, evaluation and incentives.</text><rect x="64" y="207" width="344" height="188" rx="18" fill="#1d393d" stroke="#4b7564"/><text x="88" y="252" font-family="Arial" font-size="24" fill="#d7f29e">The task</text><text x="88" y="300" font-family="Arial" font-size="26" fill="#f2f8f0">A useful job to do</text><text x="88" y="346" font-family="Arial" font-size="18" fill="#b9d7c6">Example: route support messages</text><path d="M412 298h23m-8-8 8 8-8 8" stroke="#bad7c4" stroke-width="2" fill="none"/><rect x="444" y="207" width="344" height="188" rx="18" fill="#1d393d" stroke="#4b7564"/><text x="468" y="252" font-family="Arial" font-size="24" fill="#d7f29e">Miners</text><text x="468" y="300" font-family="Arial" font-size="26" fill="#f2f8f0">Provide a result</text><text x="468" y="346" font-family="Arial" font-size="18" fill="#b9d7c6">Models or services do the work</text><path d="M792 298h23m-8-8 8 8-8 8" stroke="#bad7c4" stroke-width="2" fill="none"/><rect x="824" y="207" width="344" height="188" rx="18" fill="#1d393d" stroke="#4b7564"/><text x="848" y="252" font-family="Arial" font-size="24" fill="#d7f29e">Validators</text><text x="848" y="300" font-family="Arial" font-size="26" fill="#f2f8f0">Check the quality</text><text x="848" y="346" font-family="Arial" font-size="18" fill="#b9d7c6">Compare results using task rules</text><path d="M1172 298h23m-8-8 8 8-8 8" stroke="#bad7c4" stroke-width="2" fill="none"/><rect x="1204" y="207" width="344" height="188" rx="18" fill="#1d393d" stroke="#4b7564"/><text x="1228" y="252" font-family="Arial" font-size="24" fill="#d7f29e">The network</text><text x="1228" y="300" font-family="Arial" font-size="26" fill="#f2f8f0">Coordinates incentives</text><text x="1228" y="346" font-family="Arial" font-size="18" fill="#b9d7c6">Subtensor records participation</text><text x="64" y="460" font-family="Arial" font-size="24" fill="#e5f0df">TensorStudio helps you design the task, inspect the software and test your evaluation.</text><text x="64" y="507" font-family="Arial" font-size="18" fill="#9cbbab">Conceptual roles. A generated project or running process is not automatically a registered subnet.</text></svg>