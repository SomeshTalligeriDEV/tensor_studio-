[project]
name = "bitcode-runner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "docker>=7,<8",
    "websockets>=14,<16",
    "bittensor==11.3.0",
    "httpx>=0.27,<1",
]

[project.scripts]
runner = "bitcode_runner.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["bitcode_runner", "subcreate"]
